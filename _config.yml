# Site settings
title: "澳洲华人网球会"
email: info@actc.org.au
description: "Australian Chinese Tennis Club"
baseurl: ""
url: "https://actc.org.au"
lang: zh-CN
timezone: Australia/Sydney

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
paginate: 5
paginate_path: /others/page:num
plugins:
  - jekyll-paginate
exclude:
  - less
  - node_modules
  - Gruntfile.js
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - README.md
  - ipynb
  - mail
  - params.json
  - Untitled.ipynb
  - index.html.bak1
  - test1.txt
  - test_frame.html
  - "*.bak"
  - vendor
  - score_board/score_system.md
  - ai_tools
  - AGENTS.md
  - workflow.md
  - skills
  - scripts

# Tournament score storage (read/written via the GitHub API by js/tournament.js)
tournament_scores:
  repo: tennis4acta/tennis4acta.github.io
  branch: master
  path: events/scores

category-list: [history]
excerpt_separator: <!--more-->
