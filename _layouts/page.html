---
layout: default
---
<section class="page-hero{% unless page.wide %} is-narrow{% endunless %}">
  <div class="container">
    <div class="crumbs"><a href="{{ site.baseurl }}/">首页</a>{% if page.url contains '/history/' and page.url != '/history/' %} / <a href="{{ site.baseurl }}/history/">过往赛事</a>{% endif %}</div>
    <h1>{{ page.title }}</h1>
    {%- if page.description and page.description != '' and page.description != 'History' %}<p>{{ page.description }}</p>{% endif %}
  </div>
</section>

<div class="container page-body{% if page.wide %} page-body--wide{% endif %}">
  <article class="prose">
    {{ content }}
  </article>
</div>
