# Annual tournament settings. Update this file each year; the home page reads from it.
# Datetimes are quoted ISO strings with the Sydney offset (+11:00 during daylight saving) and drive the countdown and the
# automatic before-open / open / closed / running / finished states. *_text fields are the wording shown to visitors.

year: 2026
title: "2026 ACTC皇族香米杯华人网球大奖赛"
short_title: "皇族香米杯华人网球大奖赛"
title_en: "2026 ACTC Royal Umbrella Thai Rice Chinese Tennis Competition"
slogan: "相互交流 切磋球技 广交朋友"
poster: "img/2026_poster.jpg"
organizer: "澳洲华人网球会"
title_sponsor: "皇族香米牌泰国香米"
draw_count: 8
registration_email: "info@actc.org.au"

venue:
  name: "Parramatta City Tennis"
  address: "Barton St, North Parramatta NSW 2151"
  map_url: "https://www.google.com/maps/search/?api=1&query=Parramatta+City+Tennis+Barton+St+North+Parramatta+NSW+2151"

registration:
  opens: "2026-10-17T22:00:00+11:00"
  opens_text: "10月17日（周六）晚上10时"
  opens_short: "10月17日"
  closes: "2026-11-07T17:00:00+11:00"
  closes_text: "11月7日（周六）下午5时"
  # Set to "closed" or "full" to stop registration early (额满提前截止), or "open" to open it early. Leave empty for automatic.
  override: ""
  # Registration link (e.g. ClassHub or a /2026/register/ page). While empty, the home page shows the dates only.
  url: ""
  provider: "ClassHub"

days:
  - id: singles
    name: "单打"
    date_text: "11月15日（周日）"
    time_text: "上午8:00 开始"
    start: "2026-11-15T08:00:00+11:00"
    end: "2026-11-15T19:00:00+11:00"
    fee: 40
    fee_text: "$40 /人 + 手续费"
  - id: doubles
    name: "双打"
    date_text: "11月22日（周日）"
    time_text: "上午8:00 开始"
    start: "2026-11-22T08:00:00+11:00"
    end: "2026-11-22T19:00:00+11:00"
    fee: 60
    fee_text: "$60 /组合 + 手续费"

# Competition categories shown on the home page.
events:
  - id: singles_a
    day: singles
    name: "男子单打 A级别"
    capacity_text: "20人"
    requirements: singles_a
  - id: singles_b
    day: singles
    name: "男子单打 B级别"
    tag: "红宝石 / 蓝宝石"
    capacity_text: "红宝石 32人 + 蓝宝石 32人"
    requirements: singles_b
  - id: singles_w
    day: singles
    name: "女子单打"
    capacity_text: "16人"
    requirements: singles_w
  - id: doubles_a
    day: doubles
    name: "男子双打 A级别"
    capacity_text: "12对"
    requirements: doubles_a
  - id: doubles_b
    day: doubles
    name: "男子双打 B级别"
    capacity_text: "32对"
    requirements: doubles_b
  - id: doubles_w
    day: doubles
    name: "女子双打"
    capacity_text: "20对"
    requirements: doubles_w
  - id: doubles_s
    day: doubles
    name: "中年组双打"
    tag: "50-70岁"
    capacity_text: "10对"
    requirements: doubles_s

rules:
  constraints:
    - "大奖赛设八个项目，如果有项目报名人数不足8人（对），该项目将取消。组委会将根据报名情况调整参赛人数。"
    - "如遇恶劣天气，比赛将延后，到时请留意球会网站和球会群的消息。"

  excluded:
    - "曾经参加过国家、省、市等专业网球队，2015年12月31日后退役的球员不可参赛。"
    - "男子球员，单或双打UTR10及10以上的不可参赛。女子球员，单或双打UTR8及8以上的不可参赛。"
    - "年龄在17岁以下球员（2010年1月1日后出生），以及70岁以上球员（即1956年1月1日前出生），谢绝参赛。"
  excluded_note: "组委会保留解释权。"

  notices:
    - "参赛球员请按照驾照或护照的姓和名填写报名表，并写上英文名。还请选择来自：港、澳、台、大陆。"
    - "递交报名表后，不能擅自更换球员。如遇特殊情况，11月7日前通知组委会退赛并经回复核准，将给予退还报名费。11月7日之后退赛，不予退款。擅自换球员，将取消比赛资格。无故缺席和退赛，组委会将作进一步处理。"
    - "项目报满，自动截止报名。逾期未报上名的球员请发邮件通知列为等候名单，info@actc.org.au。"
    - "11月15日单打比赛，球员只能参加一个项目的比赛。11月22日的双打项目，球员只能参加一个项目的比赛。一经发现重复参赛，将取消其所有比赛资格和成绩，并不予退款。"
    - "赛会根据以往ACTC大奖赛的名次，列各项目种子。除非经查核实力，此外不接受列种子球员的要求。"
    - "除了部分决赛设裁判外，其余比赛均采取信任制。但组委会裁判组安排场外裁判巡回查看，如发现球员乱判，将给予警告、扣分，严重者将进一步处理。"
    - "获奖球员需参加颁奖仪式，以表示对赞助商的敬意和对赛会及志愿者的尊重。赛会不提前给予奖杯奖品奖金，无故缺席，不予补发。"
    - "<b>参赛健康承诺：</b>参赛球员必须对自身的健康负责，确保自身身体状况良好且适合参加本届网球赛事。<b>报名成功即视为球员签署了健康安全承诺书。</b>赛事组委会对球员在比赛期间因个人身体原因（包括但不限于疾病发作、突发身体不适等）引发的一切健康问题或意外事故，概不承担任何法律、民事或经济责任。"
    - "<b>运动保险要求：</b>所有参赛球员均须自行购买符合竞赛风险要求的<b>运动类人身意外伤害保险。完成报名程序即视为球员承认并确认已持有有效保险保障。</b>如在比赛中及赛事相关区域内发生受伤、致残等运动意外，均由球员本人通过其投保的保险公司进行理赔或自负，组委会不承担任何医疗费用、误工补偿及连带赔偿责任。"
    - "<b>Liability</b> All players who enter this event use the venue and compete at their own risk. Neither the event, its officials nor the venue, its staff, management or committee will be responsible for death, personal injury, or loss of or damage to property whether occurring on the premises or otherwise.<br>所有参加本次活动的运动员均须自行承担使用场地及参赛所产生的风险。无论事故发生在场地内还是其他地方，赛事主办方、赛事工作人员，以及场地方、场地工作人员、管理人员或委员会，均不对任何死亡、人身伤害，以及财物的遗失或损坏承担责任。"

  notes:
    - "以上注明的UTR，均以两年内的UTR为准。"
    - "参赛球员请仔细阅读并了解各项要求等细则。报名球员如有不符合要求的，组委会有权作出处理。"
    - "组委会对有关规定和规则保留解释权和决定权。"

requirements:
  singles_a:
    title: "男子A级别单打"
    items:
      - "业余网球等级在4.0以上的球员。"
      - "两年内单打UTR7以上（包括7）的球员。"
  singles_b:
    title: "男子B级别单打（分红宝石和蓝宝石两个区）"
    items:
      - "此项目仅限<b>纯业余球员</b>参赛，任何曾经受过专业系统训练或专业队的球员，无论退役多久均<b>不能参赛</b>。"
      - "业余网球等级在3.5以下的球员。"
      - "两年内单打UTR7以下（不包括7）的球员。"
      - "男单B级别分两个区，分别决出名次。报名时，只需填男单B级别项目，由赛会抽签分两个区。"
      - "上届男单红宝石和蓝宝石的冠军，本届和下届必须参加男单A级别项目。"
  singles_w:
    title: "女子单打"
    items:
      - "业余网球等级在2.5以上的女子球员。"
      - "两年内单打UTR8以下（不包括8）的女子球员。"
  doubles_a:
    title: "男子A级别双打"
    items:
      - "业余网球等级在4.0以上的球员。"
      - "两年内单或双打UTR7以上（包括7）的球员。"
      - "退役十年以上的专业球员，必须搭档业余球员或单/双打UTR7（不包括7）以下的球员。"
  doubles_b:
    title: "男子B级别双打"
    items:
      - "此项目仅限<b>纯业余球员</b>参赛，任何曾经受过专业系统训练或专业队的球员，无论退役多久均<b>不能参赛</b>。"
      - "业余网球等级在3.5以下的球员。"
      - "两年内单/双打UTR7以下（不包括7）的球员。"
      - "上届男双B级别冠军，本届和下届必须参加男双A级别项目。"
  doubles_w:
    title: "女子双打"
    items:
      - "业余网球等级在2.5以上的球员。"
      - "两年内单或双打UTR8以下（不包括8）的球员。"
      - "两位退役专业球员不可搭档。"
  doubles_s:
    title: "中年双打（50-70岁）"
    items:
      - "50 - 70岁男女球员（即：1956年1月1日至1976年12月31日之间出生）。"
      - "比赛当日，请携带足以证明年龄的证件，以备核查。"
      - "退役十年以上的专业球员，必须搭档业余球员或单双打UTR7（不包括7）以下的球员。"
