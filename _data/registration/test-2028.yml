# Registration form generated by skills/generate_registration (see its README). Edit freely: the page
# (_includes/registration_form.html) and the Apps Script backend (scripts/registration.gs, which reads
# /registration/forms.json) both use this file. Changes reach the backend within about 15 minutes.
year: 2028
title: "2028 ACTC 华人网球大奖赛"
# Apps Script web app /exec URL. Empty = preview mode: the form can be filled in, but nothing is sent.
endpoint: ""
# status: "" = automatic from opens/closes; "open" or "closed" overrides them. Datetimes are ISO strings with
# the Sydney offset, e.g. "2028-10-14T22:00:00+11:00"; *_text is the wording shown to visitors.
status: ""
opens: ""
opens_text: ""
closes: ""
closes_text: ""
# true: once an event is full, further entries join its waiting list in order. false: reject them.
waitlist: true
contact_email: "info@actc.org.au"
rules_url: "/#rules"
fee_note: "报名费及付款方式将另行公布。Entry fees and payment details will be announced separately."
# Age is the tournament year minus the birth year. An event may override it with its own age: {min, max}.
age: {"min":17,"max":70}
origins: ["中国大陆 Mainland China","香港 Hong Kong","澳门 Macau","台湾 Taiwan"]
# One entry per player per day. date_text is optional wording, e.g. "11月14日（周日）".
days:
  - {"id":"singles","name":"单打 Singles","date_text":""}
  - {"id":"doubles","name":"双打 Doubles","date_text":""}
# capacity counts players for singles and pairs for doubles. gender: male | female | mixed | open.
# requirements: key under requirements in _data/tournament.yml, listed under the selected event when present.
events:
  - id: "singles_a"
    name: "男子单打 A级别"
    name_en: "Men's Singles Grade A"
    day: "singles"
    format: "singles"
    gender: "male"
    capacity: 16
    requirements: "singles_a"
  - id: "singles_b"
    name: "男子单打 B级别"
    name_en: "Men's Singles Grade B"
    day: "singles"
    format: "singles"
    gender: "male"
    capacity: 64
    requirements: "singles_b"
  - id: "singles_w"
    name: "女子单打"
    name_en: "Women's Singles"
    day: "singles"
    format: "singles"
    gender: "female"
    capacity: 16
    requirements: "singles_w"
  - id: "doubles_a"
    name: "男子双打 A级别"
    name_en: "Men's Doubles Grade A"
    day: "doubles"
    format: "doubles"
    gender: "male"
    capacity: 12
    requirements: "doubles_a"
  - id: "doubles_b"
    name: "男子双打 B级别"
    name_en: "Men's Doubles Grade B"
    day: "doubles"
    format: "doubles"
    gender: "male"
    capacity: 32
    requirements: "doubles_b"
  - id: "doubles_w"
    name: "女子双打"
    name_en: "Women's Doubles"
    day: "doubles"
    format: "doubles"
    gender: "female"
    capacity: 20
    requirements: "doubles_w"
  - id: "doubles_s"
    name: "中年组双打（50-70岁）"
    name_en: "Seniors Doubles (50-70)"
    day: "doubles"
    format: "doubles"
    gender: "open"
    capacity: 10
    age: {"min":50,"max":70}
    requirements: "doubles_s"
# Checkboxes before submitting. required: must be ticked; doubles_only: shown for doubles events only.
declarations:
  - id: "rules"
    required: true
    text: "我已阅读并遵守参赛规程及所报项目的参赛要求，确认本人（双打为两位球员）符合参赛资格，所填信息真实准确。I have read the rules and event requirements, confirm eligibility (both players for doubles), and the information above is accurate."
  - id: "health"
    required: true
    text: "健康承诺：本人身体状况良好、适合参赛，并对自身健康负责。Health: I am fit to compete and responsible for my own health."
  - id: "insurance"
    required: true
    text: "运动保险：本人已自行购买有效的运动类人身意外伤害保险。Insurance: I hold valid personal accident insurance that covers playing tennis."
  - id: "liability"
    required: true
    text: "免责声明：本人自行承担参赛及使用场地的风险；赛事主办方、工作人员及场地方不对任何伤亡、财物遗失或损坏承担责任。Liability: I play at my own risk; the organisers, officials and venue are not liable for death, injury, or loss of or damage to property."
  - id: "withdrawal"
    required: true
    text: "退赛与退款：报名后不得擅自更换球员；须在报名截止前通知组委会退赛并获核准，方可退还报名费。Withdrawal: no player substitutions; entry fees are refunded only for withdrawals approved before registration closes."
  - id: "privacy"
    required: true
    text: "个人信息：同意组委会收集以上信息，仅用于本届赛事的报名、资格审核、分组、联络及公布赛程成绩（姓名会出现在网站的分组和成绩中）。Privacy: my details are used only for entries, eligibility checks, draws, contact and publishing draws/results (names appear on the website)."
  - id: "partner"
    required: true
    doubles_only: true
    text: "我已征得搭档同意，代其提交以上信息并作出上述声明。I have my partner's consent to submit their details and make these declarations on their behalf."
  - id: "photo"
    required: false
    text: "（可选）同意赛会在官网及微信群发布含本人（及搭档）的比赛照片和视频。(Optional) Photos and videos of me (and my partner) may be published on the club website and WeChat groups."
