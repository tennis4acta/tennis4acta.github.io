name: 女子双打

groups:
  A:
    - Pei Zou & Ying Huang
    - Linda Zhou & Jenny Wan
    - Jiayu Gao & Esther Dong
    - Sandy Li & Jessica Miao
  B:
    - Lin Xue & Yingxi Ma
    - Chelsea He & Ye Li
    - Helen Yang & Lili Fu
    - Kelly Xie & Krystal Zhang
  C:
    - Kiki Law & Luna Liu
    - Jun Jiang & Jackie Xu
    - Pam Qi & Ying Li
    - Wendy Wang & Sienna Li
  D:
    - Sammy Gan & Connie Wang
    - Lei Huang & Evelyn Qin
    - Monica Ye & Heli Yang
    - Bing Liang & Kate Li
    - Lauren Shen & Claudia

rules:
  advance: 2
  points: { win: 1, loss: 0, wo_loss: 0 }
  # 获胜轮数 → 获胜盘数 → 胜局数 → 负局数 → 组合间比赛成绩

  # 可选：淘汰赛首轮对阵。A1 = A组第1名，BYE = 轮空，也可直接写选手姓名。
  # 不填则自动生成（各组第1名为种子，同组选手尽量分在不同半区）。
  draw:
    - [A1, B2]
    - [D1, C2]
    - [C1, D2]
    - [B1, A2]
  # 排名依据（依次比较）：points 积分, wins 胜场, h2h 相互战绩,
  # set_diff 净胜盘, game_diff 净胜局, set_ratio 胜盘率, game_ratio 胜局率,
  # sets_won 胜盘数, games_won 胜局数, games_lost 负局数（少者优先）
  # 多人同分时按 ITF 方式处理：分出一人后，剩余同分者从头重新比较；仍无法区分则按上方名单顺序
  tiebreakers: [wins, games_won, game_diff, h2h]
  third_place: false
  # 是否在小组表下方显示“比赛顺序”（默认收起）
  show_set_column: false
  show_order: false
